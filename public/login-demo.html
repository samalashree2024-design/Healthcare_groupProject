<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Healthcare Research Demo — Login</title>
  <style>
    :root{font-family:system-ui,Segoe UI,Arial,sans-serif;color:#14233f;background:#f2f6fc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
    main{width:min(420px,100%);background:white;border:1px solid #d6e1f3;border-radius:18px;padding:30px;box-shadow:0 15px 45px #20345a1a}
    h1{font-size:23px;margin:0 0 8px}p{font-size:14px;line-height:1.55;color:#5d6980}
    label{font-size:14px;font-weight:650;display:block;margin-top:16px}
    input{width:100%;padding:12px 13px;border:1px solid #afc2df;border-radius:9px;margin-top:6px;font:inherit}
    button{width:100%;margin-top:20px;border:0;background:#285cbb;color:white;padding:13px;border-radius:9px;cursor:pointer;font-weight:650;font:inherit}
    button:disabled{opacity:.6}#status{min-height:22px;color:#a52742;font-size:13px}
    .notice{background:#fff5e2;border:1px solid #ead4a8;border-radius:9px;padding:12px;font-size:13px;color:#614b19;margin-bottom:16px}
  </style>
</head>
<body>
<main>
  <h1>Healthcare research demo</h1>
  <p>Sign in as a fictional doctor, lab technician, or patient.</p>
  <div class="notice">Local-only educational demonstration. Do not upload or enter real patient records.</div>
  <form id="login">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required maxlength="50">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">Sign in</button>
    <p id="status" role="status"></p>
  </form>
</main>
<script>
  document.getElementById('login').addEventListener('submit',async event=>{
    event.preventDefault();
    const button=document.getElementById('submit');
    const status=document.getElementById('status');
    button.disabled=true;status.textContent='Signing in...';
    try{
      const response=await fetch('/api/auth/login',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          username:document.getElementById('username').value,
          password:document.getElementById('password').value
        })
      });
      const data=await response.json();
      if(!response.ok||!data.success)throw Error(data.error||'Login failed');
      window.location.assign(data.redirect);
    }catch(err){status.textContent=err.message;button.disabled=false;}
  });
  fetch('/api/auth/me').then(r=>r.ok?r.json():null).then(d=>{
    if(d?.success){
      const destinations={doctor:'/doctor-oracle-demo.html',lab:'/lab-demo.html',patient:'/patient-demo.html'};
      window.location.replace(destinations[d.role]||'/login-demo.html');
    }
  }).catch(()=>{});
</script>
</body></html>
